<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login — AI Workday Toolkit</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#dee4d5; --white-card:#fbfaf5; --ink:#23291f; --ink-soft:#545e4c;
    --forest:#1f3a2e; --stamp-red:#b6392c; --line:#b9c0ac;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--white-card); border:1px solid var(--line); border-radius:16px;
    padding:44px 38px; max-width:420px; width:100%;
    box-shadow:0 24px 50px -30px rgba(31,58,46,.4);
  }
  .brand{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px; letter-spacing:.04em;
    display:flex; align-items:center; gap:10px; margin-bottom:26px; text-decoration:none; color:var(--ink);
  }
  .brand .mark{ width:9px; height:9px; background:var(--stamp-red); display:inline-block; transform:rotate(45deg); }
  h1{ font-family:'Fraunces', serif; font-weight:600; color:var(--forest); font-size:24px; margin-bottom:10px; }
  p.sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:26px; }
  label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; }
  input[type=email]{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:12px 14px;
    font-size:14.5px; font-family:inherit; margin-bottom:16px;
  }
  button{
    width:100%; background:var(--stamp-red); color:#f4f2e8; border:none; border-radius:8px;
    padding:14px; font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px;
    letter-spacing:.02em; text-transform:uppercase; cursor:pointer;
  }
  button:hover{ opacity:.92; }
  .fine{ font-size:12px; color:var(--ink-soft); margin-top:16px; text-align:center; }
  .fine a{ color:var(--forest); }
</style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/"><span class="mark"></span> AI WORKDAY TOOLKIT</a>
    <h1>Welcome back</h1>
    <p class="sub">Enter the email you used to join. We'll check your membership and take you straight to your tools.</p>
    <form action="/.netlify/functions/check-access" method="GET">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <button type="submit">Access my tools →</button>
    </form>
    <p class="fine">Not a member yet? <a href="/#pricing">Join the toolkit</a></p>
  </div>
</body>
</html>
